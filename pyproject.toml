[project]
name = "treasure-scanner"
version = "0.1.0"
description = "Marktplaats treasure hunter with Telegram alerts"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "rapidfuzz>=3.6",
    "structlog>=24.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "patchright>=1.45",
]

[project.optional-dependencies]
playwright = ["playwright>=1.45"]

[project.scripts]
treasure-scanner = "treasure_scanner.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
